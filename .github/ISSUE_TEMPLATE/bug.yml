name: 缺陷报告
description: 报告可复现的错误、崩溃或语义不一致
body:
  - type: input
    id: version
    attributes:
      label: 衡枢版本
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 操作系统与架构
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 最小复现源码
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: 安全确认
      options:
        - label: 此报告不包含未公开的安全漏洞；安全问题将按 SECURITY.md 私密报告
          required: true
