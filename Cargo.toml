[package]
name = "hengshu"
version = "0.9.0"
edition = "2021"
rust-version = "1.98"
description = "衡枢中文财务与数据分析编程语言"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/hengshu"
keywords = ["compiler", "data-analysis", "finance", "chinese"]
categories = ["compilers", "command-line-utilities"]

[lib]
name = "hengshu"
path = "src/lib.rs"

[features]
default = []
gui = ["dep:gpui-kit"]

[[bin]]
name = "衡枢"
path = "src/main.rs"

[[bin]]
name = "衡枢GUI"
path = "src/gui_main.rs"
required-features = ["gui"]

[dependencies]
calamine = "0.36"
arrow-array = "57"
arrow-schema = "57"
chrono = "0.4"
chrono-tz = "0.10"
base64 = "0.22"
crossbeam-channel = "0.5"
csv = "1.3"
encoding_rs = "0.8"
gpui-kit = { version = "0.6.1", optional = true }
flate2 = "1"
hmac = "0.12"
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
lettre = { version = "=0.11.22", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
minilp = "0.2"
nalgebra = "0.33"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
printpdf = { version = "0.12.6", default-features = false, features = ["jpeg", "png", "svg"] }
lopdf = "0.44"
parquet = { version = "57", features = ["arrow"] }
quick-xml = "0.41"
postcard = { version = "1", default-features = false, features = ["alloc"] }
rand = "0.8"
rayon = "1.10"
regex = "1"
scraper = "0.27"
rusqlite = { version = "0.40", features = ["bundled", "limits"] }
rust_decimal = { version = "1.36", features = ["maths", "serde-with-str"] }
rust_xlsxwriter = "0.98"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
sha2 = "0.10"
statrs = "0.18"
strsim = "=0.11.1"
subtle = "=2.6.1"
tar = "0.4"
tempfile = "3.14"
toml = "0.8"
tungstenite = "0.26"
unicode-normalization = "=0.1.24"
ureq = { version = "2.12", features = ["json"] }
url = "2"
wait-timeout = "0.2"
walkdir = "2"
zip = "8.6"
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "area_series", "point_series", "histogram", "boxplot"] }

[dev-dependencies]
proptest = "1.7"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
